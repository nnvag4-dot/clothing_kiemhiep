name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.webp'
      - '**/*.WEBP'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Changed Images using AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 1. Bắt danh sách file thêm/sửa bằng Git
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > added_files.txt || true

          # 2. Bắt danh sách file bị xóa bằng Git
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > deleted_files.txt || true

          # 3. Upload file thay đổi song song (25 luồng an toàn)
          if [ -s added_files.txt ]; then
            echo "Uploading changed files in parallel (25 workers):"
            cat added_files.txt

            export ENDPOINT R2_BUCKET_NAME
            cat added_files.txt | xargs -P 25 -I {} bash -c '
              if [ -f "$1" ]; then
                echo "Uploading: $1"
                aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$1" --endpoint-url "$ENDPOINT"
              fi
            ' _ {}
          else
            echo "No added or modified image files."
          fi

          # 4. Xóa hàng loạt siêu tốc (Sử dụng Bash + jq gom 1000 file/request)
          if [ -s deleted_files.txt ]; then
            echo "Deleting removed files in batches of 1000..."
            cat deleted_files.txt

            # Chia danh sách file xóa thành từng file chứa tối đa 1000 dòng
            split -l 1000 deleted_files.txt batch_del_

            for batch_file in batch_del_*; do
              # Tạo payload JSON chuẩn bằng jq
              jq -n --rawfile lines "$batch_file" '
                {
                  Objects: ($lines | split("\n") | map(select(length > 0) | {Key: .})),
                  Quiet: true
                }
              ' > payload.json

              echo "Executing batch delete for $(wc -l < "$batch_file") files..."
              aws s3api delete-objects \
                --bucket "$R2_BUCKET_NAME" \
                --delete file://payload.json \
                --endpoint-url "$ENDPOINT"
              
              rm -f "$batch_file" payload.json
            done
          else
            echo "No deleted image files."
          fi
