name: Sync Changed Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Lấy commit hiện tại và commit ngay trước đó

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Sync Only Changed Files
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # 1. Cấu hình Rclone
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

          # 2. Lấy danh sách file ảnh mới / sửa (Added / Modified)
          ADDED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '\.(png|PNG|jpg|jpeg|webp)$' || true)

          # 3. Lấy danh sách file ảnh bị xóa (Deleted)
          DELETED_FILES=$(git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -E '\.(png|PNG|jpg|jpeg|webp)$' || true)

          # 4. Upload các file mới / sửa lên Cloudflare R2
          if [ -n "$ADDED_FILES" ]; then
            echo "Uploading added/modified files:"
            echo "$ADDED_FILES"
            for file in $ADDED_FILES; do
              if [ -f "$file" ]; then
                rclone copyto "$file" "r2:${R2_BUCKET_NAME}/$file"
              fi
            done
          else
            echo "No added or modified image files."
          fi

          # 5. Xóa các file đã bị xóa trên GitHub khỏi Cloudflare R2
          if [ -n "$DELETED_FILES" ]; then
            echo "Deleting removed files from R2:"
            echo "$DELETED_FILES"
            for file in $DELETED_FILES; do
              rclone deletefile "r2:${R2_BUCKET_NAME}/$file"
            done
          else
            echo "No deleted image files."
          fi
