name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
  workflow_dispatch:

# Tự động hủy job cũ nếu bạn vừa push commit mới (tránh nghẽn hàng chờ)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure Rclone & Sync to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # 1. Tạo file cấu hình rclone
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

          # 2. Chạy đồng bộ siêu tốc 64 luồng song song cho 40.000 file
          rclone sync . r2:${R2_BUCKET_NAME} \
            --transfers 64 \
            --checkers 128 \
            --fast-list \
            --delete-after \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --progress
