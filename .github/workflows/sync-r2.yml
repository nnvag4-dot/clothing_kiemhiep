name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Sync Only Changed Images
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # 1. Cấu hình Rclone (Có acl = public-read)
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

          # 2. Lấy danh sách file ảnh thêm/sửa
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '\.(png|PNG|jpg|jpeg|webp)$' > added_files.txt || true

          # 3. Lấy danh sách file ảnh bị xóa
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -E '\.(png|PNG|jpg|jpeg|webp)$' > deleted_files.txt || true

          # 4. Upload đúng file thay đổi (Không scan bucket, tiết kiệm request Class A)
          if [ -s added_files.txt ]; then
            echo "Uploading changed files:"
            cat added_files.txt
            rclone copy . "r2:${R2_BUCKET_NAME}" --files-from added_files.txt --no-check-dest
          else
            echo "No added or modified image files."
          fi

          # 5. Xóa các file đã bị xóa trên GitHub
          if [ -s deleted_files.txt ]; then
            echo "Deleting removed files:"
            cat deleted_files.txt
            while IFS= read -r file; do
              rclone deletefile "r2:${R2_BUCKET_NAME}/$file"
            done < deleted_files.txt
          else
            echo "No deleted image files."
          fi
