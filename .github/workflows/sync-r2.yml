name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.webp'
      - '**/*.WEBP'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Changed Images using AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 1. Bắt danh sách file thêm/sửa
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > added_files.txt || true

          # 2. Bắt danh sách file bị xóa
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > deleted_files.txt || true

          # 3. Upload từng file bằng AWS CLI (Không scan bucket, 0 tốn Class A, 100% tương thích R2)
          if [ -s added_files.txt ]; then
            echo "Uploading changed files:"
            cat added_files.txt
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Uploading: $file"
                aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/$file" --endpoint-url "$ENDPOINT"
              fi
            done < added_files.txt
          else
            echo "No added or modified image files."
          fi

          # 4. Xóa file tương ứng trên R2
          if [ -s deleted_files.txt ]; then
            echo "Deleting removed files:"
            cat deleted_files.txt
            while IFS= read -r file; do
              echo "Deleting: $file"
              aws s3 rm "s3://${R2_BUCKET_NAME}/$file" --endpoint-url "$ENDPOINT"
            done < deleted_files.txt
          else
            echo "No deleted image files."
          fi
