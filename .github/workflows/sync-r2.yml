name: Sync Changed Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Lấy commit hiện tại và commit trước đó để so sánh

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.png
            **/*.PNG
            **/*.jpg
            **/*.jpeg
            **/*.webp

      - name: Install Rclone
        if: steps.changed-files.outputs.any_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Sync Only Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ADDED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

          # 1. Đẩy các file mới / file vừa sửa lên R2
          if [ -n "$ADDED_FILES" ]; then
            echo "Uploading added/modified files..."
            for file in $ADDED_FILES; do
              if [ -f "$file" ]; then
                rclone copyto "$file" "r2:${R2_BUCKET_NAME}/$file"
              fi
            done
          fi

          # 2. Xóa các file đã bị xóa trên GitHub khỏi R2
          if [ -n "$DELETED_FILES" ]; then
            echo "Deleting removed files from R2..."
            for file in $DELETED_FILES; do
              rclone deletefile "r2:${R2_BUCKET_NAME}/$file"
            done
          fi
