name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.webp'
      - '**/*.WEBP'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Changed Images using AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 1. Bắt danh sách file thêm/sửa bằng Git
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > added_files.txt || true

          # 2. Bắt danh sách file bị xóa bằng Git
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > deleted_files.txt || true

          # 3. Upload file thay đổi song song an toàn (Tối đa 10 luồng bằng xargs)
          if [ -s added_files.txt ]; then
            echo "Uploading changed files in parallel:"
            cat added_files.txt

            export ENDPOINT R2_BUCKET_NAME
            cat added_files.txt | xargs -P 10 -I {} bash -c '
              if [ -f "$1" ]; then
                echo "Uploading: $1"
                aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$1" --endpoint-url "$ENDPOINT"
              fi
            ' _ {}
          else
            echo "No added or modified image files."
          fi

          # 4. Xóa file đã bị xóa trên GitHub khỏi R2 (Song song)
          if [ -s deleted_files.txt ]; then
            echo "Deleting removed files in parallel:"
            cat deleted_files.txt

            export ENDPOINT R2_BUCKET_NAME
            cat deleted_files.txt | xargs -P 10 -I {} bash -c '
              echo "Deleting: $1"
              aws s3 rm "s3://${R2_BUCKET_NAME}/$1" --endpoint-url "$ENDPOINT"
            ' _ {}
          else
            echo "No deleted image files."
          fi
