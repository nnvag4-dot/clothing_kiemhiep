name: Sync Images to Cloudflare R2

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.webp'
      - '**/*.WEBP'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Changed Images using AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 1. Bắt danh sách file thêm/sửa bằng Git
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > added_files.txt || true

          # 2. Bắt danh sách file bị xóa bằng Git
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > deleted_files.txt || true

          # 3. Upload file thay đổi song song (25 luồng tối ưu)
          if [ -s added_files.txt ]; then
            echo "Uploading changed files in parallel (25 workers):"
            cat added_files.txt

            export ENDPOINT R2_BUCKET_NAME
            cat added_files.txt | xargs -P 25 -I {} bash -c '
              if [ -f "$1" ]; then
                echo "Uploading: $1"
                aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$1" --endpoint-url "$ENDPOINT"
              fi
            ' _ {}
          else
            echo "No added or modified image files."
          fi

          # 4. Xóa siêu tốc (Gộp 1.000 file/request - Xóa 20.000 file chỉ mất vài giây)
          if [ -s deleted_files.txt ]; then
            echo "Deleting removed files (Batching 1000 items per request):"
            cat deleted_files.txt

            # Chuyển danh sách file xóa sang định dạng JSON cho Batch Delete API
            python3 -c '
import json, sys

bucket = "'"${R2_BUCKET_NAME}"'"
endpoint = "'"${ENDPOINT}"'"

with open("deleted_files.txt") as f:
    files = [line.strip() for line in f if line.strip()]

# Chia nhỏ danh sách thành từng cụm 1000 file
chunk_size = 1000
for i in range(0, len(files), chunk_size):
    chunk = files[i:i + chunk_size]
    payload = {"Objects": [{"Key": key} for key in chunk], "Quiet": True}
    with open("batch_delete.json", "w") as out:
        json.dump(payload, out)
    
    import subprocess
    cmd = [
        "aws", "s3api", "delete-objects",
        "--bucket", bucket,
        "--delete", "file://batch_delete.json",
        "--endpoint-url", endpoint
    ]
    subprocess.run(cmd, check=True)
    print(f"Deleted batch {i // chunk_size + 1}: {len(chunk)} files")
'
          else
            echo "No deleted image files."
          fi
